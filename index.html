<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Atualização - Tempo Real (Supabase)</title>

    <style>
        :root {
            --bg-dark: #0f172a;
            --surface-dark: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 15px; display: flex; flex-direction: column; gap: 12px; height: 100vh; overflow: hidden; }
        
        .top-bar { display: flex; gap: 15px; background: var(--surface-dark); border: 1px solid var(--border); padding: 12px 15px; border-radius: 8px; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .alert-box { font-size: 0.9rem; display: flex; align-items: center; gap: 8px; color: #38bdf8; font-weight: 500; }
        .progress-container { display: flex; align-items: center; gap: 10px; width: 300px; }
        .progress-bar-bg { flex: 1; background: #334155; height: 10px; border-radius: 5px; overflow: hidden; }
        .progress-bar-fill { background: var(--success); height: 100%; width: 0%; transition: width 0.4s ease; }
        
        .main-content { display: flex; gap: 15px; flex: 1; overflow: hidden; }
        
        .panel { background: var(--surface-dark); border: 1px solid var(--border); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); height: 100%; overflow: hidden; }
        .list-container { flex: 0 0 46%; max-width: 48%; }
        .calendar-container { flex: 1; background: #111827; position: relative; }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 10px; flex-shrink: 0; }
        h2 { margin: 0; font-size: 1.1rem; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        
        .filters { display: flex; gap: 5px; }
        .filter-btn { background: #334155; border: none; color: #cbd5e1; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; }
        .filter-btn.active, .filter-btn:hover { background: var(--primary); color: white; }

        .table-scroll-area { flex: 1; overflow-y: auto; overflow-x: hidden; }
        .table-scroll-area::-webkit-scrollbar { width: 5px; }
        .table-scroll-area::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; table-layout: fixed; }
        th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid #334155; word-wrap: break-word; color: #e2e8f0; }
        th { background: #1e293b; position: sticky; top: 0; z-index: 10; font-size: 0.8rem; color: #94a3b8; }
        th:nth-child(1) { width: 26%; } th:nth-child(2) { width: 34%; } th:nth-child(3) { width: 14%; text-align: center; } th:nth-child(4) { width: 12%; text-align: center; } th:nth-child(5) { width: 14%; text-align: center; }
        tr:hover { background-color: rgba(255,255,255,0.02); }
        .checkbox-cell { text-align: center; }

        input[type="checkbox"] { appearance: none; width: 16px; height: 16px; background: #334155; border: 1px solid #475569; border-radius: 4px; cursor: pointer; position: relative; vertical-align: middle; }
        input[type="checkbox"]:checked { background: var(--success); border-color: var(--success); }
        input[type="checkbox"]:checked::after { content: '✔'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 10px; font-weight: bold; }

        /* Botão alternador de OLT direto na tabela */
        .btn-olt-toggle { background: #334155; border: 1px solid #475569; color: #cbd5e1; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; }
        .btn-olt-toggle.has-olt { background: rgba(34, 197, 94, 0.2); color: #4ade80; border-color: #22c55e; }
        .btn-olt-toggle:hover { opacity: 0.8; }

        .calendar-scroll-area { flex: 1; overflow-y: auto; }
        .calendar-scroll-area::-webkit-scrollbar { width: 5px; }
        .calendar-scroll-area::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        .months-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; padding-bottom: 15px; }
        .month-card { border: 1px solid #374151; border-radius: 8px; overflow: hidden; background: #1f2937; }
        .month-header { background: #1e3a8a; color: white; text-align: center; padding: 8px; font-weight: bold; text-transform: capitalize; font-size: 0.9rem; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #374151; }
        .day-name { background: #111827; text-align: center; padding: 5px; font-size: 0.75rem; font-weight: bold; color: #9ca3af; }
        
        .day-cell { background: #1f2937; height: 95px; padding: 4px; cursor: pointer; transition: 0.2s; position: relative; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
        .day-cell::-webkit-scrollbar { width: 3px; }
        .day-cell::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        .day-cell:hover { background: #374151; }
        .day-number { font-weight: bold; font-size: 0.8rem; color: #9ca3af; margin-bottom: 3px; flex-shrink: 0; }
        .day-cell.empty { background: #111827; cursor: default; }
        
        .schedule-item { font-size: 0.7rem; padding: 3px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 1px 2px rgba(0,0,0,0.2); font-weight: 500; flex-shrink: 0; }
        .schedule-item.DM { background-color: #2563eb; color: white; }
        .schedule-item.S6 { background-color: #dc2626; color: white; }
        .schedule-item.OLT { background-color: #374151; border: 1px solid #6b7280; color: #f3f4f6; }
        .schedule-item.completed { opacity: 0.4; text-decoration: line-through; }

        #custom-tooltip {
            position: fixed;
            display: none;
            background: rgba(15, 23, 42, 0.98);
            border: 1px solid #475569;
            backdrop-filter: blur(8px);
            color: #f8fafc;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            z-index: 9999;
            pointer-events: none;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            min-width: 180px;
            max-width: 260px;
            transform: translate(-50%, -100%);
        }
        #custom-tooltip h4 { margin: 0 0 6px 0; font-size: 0.85rem; border-bottom: 1px solid #334155; padding-bottom: 4px; color: #38bdf8; }
        .tooltip-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .tooltip-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .tooltip-dot.DM { background-color: #2563eb; }
        .tooltip-dot.S6 { background-color: #dc2626; }
        .tooltip-dot.OLT { background-color: #9ca3af; }

        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
        .modal-content { background: var(--surface-dark); border: 1px solid var(--border); padding: 20px; border-radius: 12px; width: 450px; max-width: 90%; display: flex; flex-direction: column; max-height: 90vh; }
        .modal-content input[type="text"], .modal-content select { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid var(--border); color: #fff; border-radius: 6px; outline: none; }
        .modal-content select option { background: #0f172a; color: #fff; }
        .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-cancel { background: #334155; color: #f8fafc; margin-right: 8px; }
        .btn-remove { background: rgba(239, 68, 68, 0.15); color: #f87171; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }

        .btn-sm { background: #334155; color: #cbd5e1; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
        .btn-sm:hover { background: #475569; color: white; }
    </style>
</head>
<body>

    <div id="custom-tooltip">

        <div id="tooltip-items"></div>
    </div>

    <div class="top-bar">

        <div class="progress-container">

        </div>
        <div class="action-bar">
            <button class="btn-sm" onclick="exportData()">💾 Baixar Backup</button>

        </div>
    </div>

    <div class="main-content">
        <div class="panel list-container">
            <div class="panel-header">
                <h2>🖥️ Equipamentos</h2>
                <div class="filters">
                    <button class="filter-btn active" onclick="setFilter('all', this)">Todos</button>

                </div>
            </div>
            <div class="table-scroll-area">
                <table>
                    <thead>
                        <tr>
                            <th>CPD</th>
                            <th>Switch</th>
                            <th class="checkbox-cell">Switch</th>
                            <th class="checkbox-cell">Possui OLT</th>
                            <th class="checkbox-cell">OLT</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>

        <div class="panel calendar-container">
            <div class="panel-header">
                <h2>📅 Programação Semestral (Tempo Real)</h2>
            </div>
            <div class="calendar-scroll-area">
                <div id="calendar-wrapper" class="months-grid"></div>
            </div>
        </div>
    </div>

    <div id="modal">

            <p style="margin:0 0 10px 0; font-size: 0.85rem; color: var(--text-muted);">Dia: <strong id="selected-date-text" style="color: var(--text-main);"></strong></p>

            <h4 style="margin:0 0 5px 0; font-size: 0.9rem;">Adicionar Equipamento</h4>
            <input type="text" id="equip-search" placeholder="Pesquise por CPD, OLT ou Switch..." autocomplete="off">
            <select id="equip-select" size="4"></select>
            <div style="text-align: right; margin-top: 12px; display: flex; justify-content: flex-end;">
                <button class="btn btn-cancel" onclick="closeModal()">Fechar</button>
                <button class="btn btn-primary" onclick="saveSchedule()">Adicionar ao Dia</button>
            </div>
        </div>
    </div>

        async function loadDataFromCloud() {
            let { data: eqData, error: eqError } = await supabaseClient.from('equipments').select('*');
            if (eqError || !eqData || eqData.length === 0) {
                for(let eq of defaultEquipments) {
                    await supabaseClient.from('equipments').upsert(eq);
                }
                equipments = defaultEquipments;
            } else {
                equipments = eqData.sort((a,b) => a.id - b.id);
            }

            let { data: schData, error: schError } = await supabaseClient.from('schedules').select('*');
            schedules = {};
            if (schData) {
                schData.forEach(row => { schedules[row.date_str] = row.items; });
            }

            updateUI();
            setupRealtime();
        }

        function setupRealtime() {
            supabaseClient.channel('db-changes')
                .on('postgres_changes', { event: '*', schema: 'public' }, payload => {
                    loadDataFromCloud();
                })
                .subscribe();
        }

        function updateUI() {
            renderTable();
            renderCalendar();
            updateProgressAndAlert();
        }

        function updateProgressAndAlert() {
            let total = 0, done = 0;
            equipments.forEach(eq => {
                total++; if(eq.switch_updated) done++;
                if(eq.has_olt) { total++; if(eq.olt_updated) done++; }
            });
            let pct = total > 0 ? Math.round((done / total) * 100) : 0;
            document.getElementById('progress-text').innerText = `Progresso Geral: ${pct}%`;
            document.getElementById('progress-fill').style.width = pct + '%';

            let todayStr = new Date().toISOString().split('T')[0];
            let todaySched = schedules[todayStr] || [];
            let alertBox = document.getElementById('today-alert');
            if(todaySched.length > 0) {
                let pendentes = todaySched.filter(s => !s.completed).length;
                alertBox.innerHTML = `🔔 Hoje (${todaySched.length} agendados / ${pendentes} pendentes)`;
            } else {
                alertBox.innerHTML = `☕ Nenhum agendamento para hoje.`;
            }
        }

        window.setFilter = function(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            equipments.forEach((eq, index) => {
                let swDone = eq.switch_updated;
                let oltDone = eq.has_olt ? eq.olt_updated : true;
                let isAllDone = swDone && oltDone;

                if (currentFilter === 'pending' && isAllDone) return;
                if (currentFilter === 'done' && !isAllDone) return;

                const tr = document.createElement('tr');
                
                // Botão interativo para ligar/desligar OLT diretamente na tabela
                let oltToggleBtn = `<button class="btn-olt-toggle ${eq.has_olt ? 'has-olt' : ''}" onclick="toggleHasOlt(${index})">${eq.has_olt ? 'Com OLT' : 'Sem OLT'}</button>`;
                let oltCheck = eq.has_olt ? `<input type="checkbox" ${eq.olt_updated ? 'checked' : ''} onchange="toggleUpdate(${index}, 'olt')">` : `-`;

                tr.innerHTML = `
                    <td><strong>${eq.cpd}</strong></td>
                    <td style="font-size: 0.8rem; color: #cbd5e1;">${eq.switch_model}</td>
                    <td class="checkbox-cell"><input type="checkbox" ${eq.switch_updated ? 'checked' : ''} onchange="toggleUpdate(${index}, 'switch')"></td>
                    <td class="checkbox-cell">${oltToggleBtn}</td>
                    <td class="checkbox-cell">${oltCheck}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.toggleHasOlt = async function(index) {
            equipments[index].has_olt = !equipments[index].has_olt;
            await supabaseClient.from('equipments').upsert(equipments[index]);
            updateUI();
        }

        window.toggleUpdate = async function(index, type) {
            if(type === 'switch') equipments[index].switch_updated = !equipments[index].switch_updated;
            if(type === 'olt') equipments[index].olt_updated = !equipments[index].olt_updated;

            await supabaseClient.from('equipments').upsert(equipments[index]);
            updateUI();
        }

        function renderCalendar() {
            const wrapper = document.getElementById('calendar-wrapper');
            wrapper.innerHTML = '';
            let currentDate = new Date();
            
            for (let i = 0; i < 6; i++) {
                let monthDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + i, 1);
                let year = monthDate.getFullYear();
                let month = monthDate.getMonth();
                
                let monthCard = document.createElement('div');
                monthCard.className = 'month-card';
                monthCard.innerHTML = `<div class="month-header">${monthDate.toLocaleString('pt-BR', { month: 'long', year: 'numeric' })}</div>`;
                
                let daysGrid = document.createElement('div');
                daysGrid.className = 'days-grid';
                ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].forEach(wd => daysGrid.innerHTML += `<div class="day-name">${wd}</div>`);

                let firstDayIndex = monthDate.getDay();
                for(let j=0; j<firstDayIndex; j++) daysGrid.innerHTML += `<div class="day-cell empty"></div>`;

                let daysInMonth = new Date(year, month + 1, 0).getDate();
                for(let d = 1; d <= daysInMonth; d++){
                    let dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    let dayCell = document.createElement('div');
                    dayCell.className = 'day-cell';
                    dayCell.innerHTML = `<div class="day-number">${d}</div>`;
                    
                    dayCell.onclick = () => openModal(dateStr, `${d} de ${monthDate.toLocaleString('pt-BR', {month: 'long'})}`);
                    
                    if(schedules[dateStr] && schedules[dateStr].length > 0) {
                        dayCell.onmouseenter = (e) => showTooltip(e, dateStr, `${d} de ${monthDate.toLocaleString('pt-BR', {month: 'long', year: 'numeric'})}`);
                        dayCell.onmouseleave = hideTooltip;

                        schedules[dateStr].forEach(itemObj => {
                            let schedDiv = document.createElement('div');
                            schedDiv.className = `schedule-item ${itemObj.type} ${itemObj.completed ? 'completed' : ''}`;
                            schedDiv.innerHTML = `${itemObj.completed ? '✓ ' : ''}${itemObj.text}`;
                            dayCell.appendChild(schedDiv);
                        });
                    }
                    daysGrid.appendChild(dayCell);
                }
                monthCard.appendChild(daysGrid);
                wrapper.appendChild(monthCard);
            }
        }

        const tooltip = document.getElementById('custom-tooltip');
        function showTooltip(e, dateStr, friendlyDate) {
            document.getElementById('tooltip-date').innerText = friendlyDate;
            let itemsContainer = document.getElementById('tooltip-items');
            itemsContainer.innerHTML = '';
            
            schedules[dateStr].forEach(item => {
                let statusText = item.completed ? ' (Concluído)' : '';
                let row = document.createElement('div');
                row.className = 'tooltip-row';
                row.innerHTML = `
                    <div class="tooltip-dot ${item.type}"></div>
                    <span style="${item.completed ? 'text-decoration: line-through; opacity: 0.5;' : ''}">${item.text}${statusText}</span>
                `;
                itemsContainer.appendChild(row);
            });

            tooltip.style.display = 'block';
            positionTooltip(e);
        }

        function positionTooltip(e) {
            let rect = e.currentTarget.getBoundingClientRect();
            let x = rect.left + (rect.width / 2);
            let y = rect.top - 8;
            
            tooltip.style.left = x + 'px';
            tooltip.style.top = y + 'px';
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        window.openModal = function(dateStr, friendlyDate) {
            selectedDateStr = dateStr;
            document.getElementById('selected-date-text').innerText = friendlyDate;
            document.getElementById('equip-search').value = ''; 
            renderModalSchedules();
            
            currentModalOptions = [];
            equipments.forEach(eq => {
                let swType = eq.switch_model.toUpperCase().startsWith('DM') ? 'DM' : 'S6';
                currentModalOptions.push({
                    value: JSON.stringify({ cpd: eq.cpd, type: swType, text: eq.cpd + " (Switch)", isOlt: false, completed: false }),
                    label: `Switch - ${eq.cpd} (${eq.switch_model.split('-')[0].trim()})`,
                    searchTerms: (`switch ${eq.cpd} ${eq.switch_model}`).toLowerCase()
                });
                // Só adiciona OLT na lista de agendamento se o equipamento realmente tiver OLT ativada (`eq.has_olt` for true)
                if (eq.has_olt) {
                    currentModalOptions.push({
                        value: JSON.stringify({ cpd: eq.cpd, type: "OLT", text: "OLT - " + eq.cpd, isOlt: true, completed: false }),
                        label: `OLT - ${eq.cpd}`,
                        searchTerms: (`olt ${eq.cpd}`).toLowerCase()
                    });
                }
            });
            renderModalOptions('');
            document.getElementById('modal').style.display = 'flex';
        };

        function renderModalSchedules() {
            const listContainer = document.getElementById('modal-schedule-list');
            listContainer.innerHTML = '';
            const daySchedules = schedules[selectedDateStr] || [];

            if (daySchedules.length === 0) {
                listContainer.innerHTML = '<p style="margin:0; font-size: 0.8rem; color: var(--text-muted); text-align: center;">Nenhum agendamento neste dia.</p>';
            } else {
                daySchedules.forEach((item, idx) => {
                    listContainer.innerHTML += `
                        <div class="modal-schedule-item">
                            <div style="display:flex; align-items:center; gap: 8px;">
                                <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleComplete('${selectedDateStr}', ${idx})">
                                <span class="${item.completed ? 'text-completed' : ''}">${item.text}</span>
                            </div>
                            <button class="btn-remove" onclick="removeSchedule('${selectedDateStr}', ${idx})">Excluir</button>
                        </div>`;
                });
            }
        }

        window.toggleComplete = async function(dateStr, idx) {
            let item = schedules[dateStr][idx];
            item.completed = !item.completed;
            
            let eqIndex = equipments.findIndex(e => e.cpd === item.cpd);
            if (eqIndex !== -1) {
                if (item.isOlt) equipments[eqIndex].olt_updated = item.completed;
                else equipments[eqIndex].switch_updated = item.completed;
                await supabaseClient.from('equipments').upsert(equipments[eqIndex]);
            }

            await supabaseClient.from('schedules').upsert({ date_str: dateStr, items: schedules[dateStr] });
            updateUI();
            renderModalSchedules();
        }

        window.removeSchedule = async function(dateStr, idx) {
            schedules[dateStr].splice(idx, 1);
            if(schedules[dateStr].length === 0) {
                delete schedules[dateStr];
                await supabaseClient.from('schedules').delete().eq('date_str', dateStr);
            } else {
                await supabaseClient.from('schedules').upsert({ date_str: dateStr, items: schedules[dateStr] });
            }
            updateUI();
            renderModalSchedules();
        }

        window.saveSchedule = async function() {
            const select = document.getElementById('equip-select');
            if(!select.value) return alert('Selecione um equipamento!');
            
            if(!schedules[selectedDateStr]) schedules[selectedDateStr] = [];
            schedules[selectedDateStr].push(JSON.parse(select.value));
            
            await supabaseClient.from('schedules').upsert({ date_str: selectedDateStr, items: schedules[selectedDateStr] });
            select.value = "";
            updateUI();
            renderModalSchedules();
        };

        window.exportData = function() {
            let backup = { equipments, schedules };
            let blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'json' });
            let a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `backup-painel-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        window.importData = async function(event) {
            let file = event.target.files[0];
            if(!file) return;
            let reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    let backup = JSON.parse(e.target.result);
                    if(backup.equipments && backup.schedules) {
                        for(let eq of backup.equipments) await supabaseClient.from('equipments').upsert(eq);
                        for(let date in backup.schedules) await supabaseClient.from('schedules').upsert({ date_str: date, items: backup.schedules[date] });
                        alert('Backup restaurado com sucesso!');
                        loadDataFromCloud();
                    }
                } catch(err) { alert('Erro ao ler arquivo de backup.'); }
            };
            reader.readAsText(file);
        }

        document.getElementById('equip-search').addEventListener('input', (e) => {
            const select = document.getElementById('equip-select');
            select.innerHTML = '';
            let term = e.target.value.toLowerCase();
            currentModalOptions.filter(o => o.searchTerms.includes(term)).forEach(o => {
                select.innerHTML += `<option value='${o.value}'>${o.label}</option>`;
            });
        });

        window.renderModalOptions = function(term) {
            const select = document.getElementById('equip-select');
            select.innerHTML = '';
            currentModalOptions.forEach(o => {
                select.innerHTML += `<option value='${o.value}'>${o.label}</option>`;
            });
        }

        window.closeModal = () => document.getElementById('modal').style.display = 'none';

        loadDataFromCloud();
    </script>
</body>
</html>
